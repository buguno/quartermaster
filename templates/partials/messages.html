{% for message in messages %}
<p class="mb-4 rounded-lg px-3 py-2 text-sm {% if message.level_tag == 'error' %}bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-300{% else %}bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300{% endif %}" role="status">{{ message }}</p>
{% endfor %}
