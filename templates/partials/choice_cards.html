<fieldset>
  <legend class="mb-2 block text-sm font-medium">{{ field.label }}</legend>
  <div class="grid gap-2 sm:grid-cols-3">
    {% for radio in field %}
    <label class="cursor-pointer">
      {{ radio.tag }}
      <span class="block rounded-lg border border-stone-300 px-3 py-2.5 text-center text-sm font-medium transition hover:bg-stone-50 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-800 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-emerald-600 dark:border-stone-700 dark:hover:bg-stone-800 dark:peer-checked:border-emerald-500 dark:peer-checked:bg-emerald-950 dark:peer-checked:text-emerald-300">{{ radio.choice_label }}</span>
    </label>
    {% endfor %}
  </div>
  {% for error in field.errors %}<p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ error }}</p>{% endfor %}
</fieldset>
