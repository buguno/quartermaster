{% for error in form.non_field_errors %}
<p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950 dark:text-red-300">{{ error }}</p>
{% endfor %}
{% for field in form %}
<div>
  {% if field.widget_type == 'checkbox' %}
  <label for="{{ field.id_for_label }}" class="flex items-center gap-2 text-sm font-medium">{{ field }} {{ field.label }}</label>
  {% else %}
  <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium">{{ field.label }}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="mt-1 text-xs text-stone-500 dark:text-stone-400 [&_ul]:list-disc [&_ul]:pl-4">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
