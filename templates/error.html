{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans 'Error' %} · Quartermaster{% endblock %}
{% block content %}
<div class="card mx-auto max-w-lg p-6 text-center">
  <h1 class="text-xl font-semibold">{% trans 'Could not complete the action' %}</h1>
  <p class="mt-2 text-stone-600 dark:text-stone-300">{{ message }}</p>
  <a href="javascript:history.back()" class="btn-secondary mt-4">{% trans 'Go back' %}</a>
</div>
{% endblock %}
