services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quartermaster
      POSTGRES_PASSWORD: quartermaster
      POSTGRES_DB: quartermaster
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quartermaster']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
